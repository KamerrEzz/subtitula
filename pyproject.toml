[project]
name = "youtube-whisper-studio"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "av>=12,<16",
    "customtkinter>=6.0.0",
    "faster-whisper>=1.2.1",
    "nvidia-cublas-cu12>=12.4,<12.9 ; sys_platform == 'win32'",
    "pillow>=13.0.0",
    "tkinterdnd2>=0.7.0",
    "yt-dlp[default,deno]>=2026.10.26",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
